services:
  pathbay:
    image: ghcr.io/lsy223622/pathbay
    user: "1000:1000"
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 45s
    command: ["--listen", "127.0.0.1:7284", "--data-dir", "/data"]
    environment:
      TZ: Asia/Shanghai
      PATHBAY_TRUSTED_PROXIES: "127.0.0.1/32,::1/128"
    volumes:
      - ./data:/data
