name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  packages: write
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Collect verified CI artifacts for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId')
          test -n "$run"
          gh run download "$run" --pattern 'pathbay-*' --dir artifacts
          for directory in artifacts/*; do
            (cd "$directory" && sha256sum -c ./*.sha256)
          done
      - name: Publish verified multi-platform image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for arch in amd64 arm64; do
            docker load -i "artifacts/pathbay-image-$arch/pathbay-image-linux-$arch.tar.gz"
            test "$(docker image inspect "pathbay:ci-$arch" --format '{{.Os}}/{{.Architecture}}')" = "linux/$arch"
            test "$(docker image inspect "pathbay:ci-$arch" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
            docker tag "pathbay:ci-$arch" "$image:$GITHUB_REF_NAME-$arch"
            docker push "$image:$GITHUB_REF_NAME-$arch"
          done
          docker buildx imagetools create -t "$image:$GITHUB_REF_NAME" "$image:$GITHUB_REF_NAME-amd64" "$image:$GITHUB_REF_NAME-arm64"
      - name: Publish binary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/pathbay-linux-*/* artifacts/pathbay-windows-*/* --verify-tag --generate-notes
  latest:
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || (needs.release.result == 'success' && !contains(github.ref_name, '-')))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Update latest stable image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$image:latest" "$image:$version"
