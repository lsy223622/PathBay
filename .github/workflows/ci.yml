name: CI
on:
  push:
    branches: [main, codex/pathbay-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go test ./internal/pathbay -run '^$' -bench . -benchmem | tee benchmarks.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-results
          path: benchmarks.txt
  linux:
    needs: test
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: binary
          outputs: type=local,dest=out
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: |
          chmod +x out/pathbay
          docker buildx build --platform linux/${{ matrix.arch }} --load -t pathbay:ci .
          docker run --rm --platform linux/${{ matrix.arch }} pathbay:ci --help
          tar -czf pathbay-linux-${{ matrix.arch }}.tar.gz -C out pathbay -C "$GITHUB_WORKSPACE" README.md LICENSE
          sha256sum pathbay-linux-${{ matrix.arch }}.tar.gz > pathbay-linux-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pathbay-linux-${{ matrix.arch }}
          path: |
            pathbay-linux-${{ matrix.arch }}.tar.gz
            pathbay-linux-${{ matrix.arch }}.sha256
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $env:CGO_ENABLED = '1'
          go test ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -trimpath -ldflags='-s -w' -o pathbay.exe ./cmd/pathbay
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path pathbay.exe,README.md,LICENSE -DestinationPath pathbay-windows-amd64.zip
          (Get-FileHash pathbay-windows-amd64.zip -Algorithm SHA256).Hash.ToLower() + '  pathbay-windows-amd64.zip' | Set-Content pathbay-windows-amd64.sha256
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pathbay-windows-amd64
          path: |
            pathbay-windows-amd64.zip
            pathbay-windows-amd64.sha256
